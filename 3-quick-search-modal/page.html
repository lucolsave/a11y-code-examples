<main>
  <h1>Quick search dialog</h1>
  <search>
    <button id="open-modal" class="search-trigger" aria-controls="search-modal" aria-haspopup="dialog">
      <?xml version="1.0" encoding="utf-8"?><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
      <svg fill="#000000" width="800px" height="800px" viewBox="-2 0 19 19" xmlns="http://www.w3.org/2000/svg"
        class="cf-icon-svg" aria-hidden="true">
        <path
          d="M14.147 15.488a1.112 1.112 0 0 1-1.567 0l-3.395-3.395a5.575 5.575 0 1 1 1.568-1.568l3.394 3.395a1.112 1.112 0 0 1 0 1.568zm-6.361-3.903a4.488 4.488 0 1 0-1.681.327 4.443 4.443 0 0 0 1.68-.327z" />
      </svg>
      <span id="open-button-text">Search cute animals</span>
    </button>

    <dialog id="search-modal" aria-modal="true" class="modal" aria-label="Global search">
      <form>
        <!-- We need a label as well along with the placeholder because VoiceOver reads the placeholder last -->
        <label for="search-input" class="sr-only">Search cute animals</label>
        <div class="search-container">
          <svg fill="#000000" width="800px" height="800px" viewBox="-2 0 19 19" xmlns="http://www.w3.org/2000/svg"
            class="cf-icon-svg" aria-hidden="true">
            <path
              d="M14.147 15.488a1.112 1.112 0 0 1-1.567 0l-3.395-3.395a5.575 5.575 0 1 1 1.568-1.568l3.394 3.395a1.112 1.112 0 0 1 0 1.568zm-6.361-3.903a4.488 4.488 0 1 0-1.681.327 4.443 4.443 0 0 0 1.68-.327z" />
          </svg>
          <input type="search" id="search-input" placeholder="Search cute animals" autocomplete="off"
            aria-controls="results" />
          <button
            type="button"
            id="clear-search"
            class="clear-search-button"
            aria-label="Clear search input"
            hidden
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <button id="confirm-search" class="confirm-search">Search</button>
        <button id="close-modal" aria-label="Close search dialog" class="close-button">
          &times;
        </button>
      </form>

      <div id="results"></div>
      <div aria-live="polite" aria-atomic="true" id="live-region" class="sr-only"></div>
    </dialog>
  </search>
</main>
