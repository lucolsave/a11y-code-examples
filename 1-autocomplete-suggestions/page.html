<main>
  <h1>Autocomplete suggestions</h1>
  <search>
    <form>
      <div class="search-container">
        <svg fill="#000000" width="800px" height="800px" viewBox="-2 0 19 19" xmlns="http://www.w3.org/2000/svg"
          class="cf-icon-svg" aria-hidden="true">
          <path
            d="M14.147 15.488a1.112 1.112 0 0 1-1.567 0l-3.395-3.395a5.575 5.575 0 1 1 1.568-1.568l3.394 3.395a1.112 1.112 0 0 1 0 1.568zm-6.361-3.903a4.488 4.488 0 1 0-1.681.327 4.443 4.443 0 0 0 1.68-.327z" />
        </svg>
        <label for="search-input" class="sr-only">Search countries</label>
        <input id="search-input" type="search" role="combobox" aria-autocomplete="list"
          aria-controls="autocomplete-list" aria-haspopup="listbox" aria-expanded="false" aria-activedescendant=""
          autocomplete="off" placeholder="Search countries" />
        <button id="confirm-search" class="confirm-search" aria-label="Search">
          Search
        </button>
        <button id="close-suggestions" class="close-suggestions hidden sr-only">
          Close suggestions
        </button>
      </div>
    </form>
    <div class="autocomplete-container">
      <div id="autocomplete-list" role="listbox" class="autocomplete-list hidden" aria-label="Search suggestions"
        tabindex="0"></div>
    </div>
  </search>
  <div aria-live="polite" aria-atomic="true" id="search-status" class="search-status sr-only"></div>
</main>
